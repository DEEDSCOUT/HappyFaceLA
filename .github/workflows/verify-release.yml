name: verify-release

# Anti-regression gate (issue #38). Runs on every PR targeting main and on
# pushes to main. Fails the PR if any owner baseline regresses (old phone
# numbers, homepage/soccer/Plan My Party baselines, sitemap/canonical SEO
# state, or unapproved image changes), if lead-delivery tests fail, or if the
# release build/postbuild QA regresses.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for stale-branch detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Stripe secret guard
        run: node scripts/guard-stripe-secrets.mjs

      - name: Stripe secret guard self-test
        run: node tests/security/stripe-secret-guard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Full release verification
        run: npm run verify:release
